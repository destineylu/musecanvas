name: Publish Windows download
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v1.0.1
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build standalone Windows ZIP
        run: python scripts/package-windows.py
      - name: Verify fresh Windows installation
        run: ./scripts/test-windows-package.ps1 -PackageZip dist-release/musecanvas-windows-x64.zip
      - name: Publish Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "musecanvas v1.0 · Windows 一键启动版" --notes-file deploy/RELEASE.md
          gh release upload "$TAG" dist-release/musecanvas-windows-x64.zip dist-release/SHA256SUMS --clobber
