# Mua —— NAS / Docker 部署
# 用法（在本目录）：cp .env.example .env && 改好 .env，然后 docker compose up -d --build
#
# 将 BRIDGE_BASE_URL 配置为容器可访问的 MuseFlow 或 API Bridge 地址。
# Mua 使用 SQLite，本部署运行一个实例。

services:
  mua:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: mua:1.2.12
    container_name: mua
    restart: unless-stopped

    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      TZ: Asia/Shanghai

    ports:
      - "8787:8787"     # 建议只绑内网： "192.168.1.10:8787:8787"

    volumes:
      - ./data/server:/app/server/data                 # SQLite、作品、上传

    mem_limit: 2g              # 3 人以内够用；生视频多可放宽
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
