# musecanvas —— NAS / Docker 部署
# 用法（在本目录）：cp .env.example .env && 改好 .env，然后 docker compose up -d --build
#
# 将 BRIDGE_BASE_URL 配置为容器可访问的 MuseFlow 或 API Bridge 地址。
# musecanvas 使用 SQLite，本部署运行一个实例。

services:
  musecanvas:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: musecanvas:1.0
    container_name: musecanvas
    restart: unless-stopped

    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      TZ: Asia/Shanghai
      ACCESS_MODE: account

    ports:
      - "8787:8787"     # 建议只绑内网： "192.168.1.10:8787:8787"

    volumes:
      - ./data/server:/app/server/data
      - ./data/engine:/app/engine

    shm_size: 256m
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 384
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
