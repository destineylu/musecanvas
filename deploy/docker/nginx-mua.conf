# Mua 反代示例（nginx，适合群晖/威联通/TrueNAS 自带的反向代理或独立 nginx）
# 关键点：SSE 必须关缓冲、超时要放到 30 分钟以上（生视频动辄 5~10 分钟）、上传上限拉大

server {
    listen 443 ssl;
    http2 on;
    server_name mua.example.com;

    ssl_certificate     /etc/nginx/certs/mua.crt;
    ssl_certificate_key /etc/nginx/certs/mua.key;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 不缓冲：否则流式对话会一次性憋到最后
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    7800s;
    }
}

# 若只用 HTTP（仅限可信内网！）：把上面 443/ssl 部分换成
# server { listen 80; server_name nas.lan; location / { ... 同上 ... } }
